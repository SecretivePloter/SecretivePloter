<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Build System: Make it work, make it right, make it faster</title>
  <desc id="desc">A three-stage engineering sequence from working software to correct software to faster software.</desc>
  <rect width="900" height="260" rx="20" fill="#0d1117"/>
  <text x="48" y="52" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">BUILD SYSTEM</text>
  <text x="48" y="80" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="14">Sequence before sophistication</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="48" y="112" width="230" height="104" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
    <circle cx="80" cy="144" r="16" fill="#f0883e"/>
    <text x="80" y="150" fill="#0d1117" font-size="15" font-weight="700" text-anchor="middle">1</text>
    <text x="110" y="146" fill="#f0f6fc" font-size="19" font-weight="700">Make it work</text>
    <text x="110" y="174" fill="#8b949e" font-size="13">Prove the value.</text>
    <text x="110" y="194" fill="#8b949e" font-size="13">Ship the smallest useful thing.</text>

    <path d="M300 164 H337" stroke="#484f58" stroke-width="2"/>
    <path d="M330 158 L340 164 L330 170" fill="none" stroke="#8b949e" stroke-width="2"/>

    <rect x="340" y="112" width="230" height="104" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <circle cx="372" cy="144" r="16" fill="#58a6ff"/>
    <text x="372" y="150" fill="#0d1117" font-size="15" font-weight="700" text-anchor="middle">2</text>
    <text x="402" y="146" fill="#f0f6fc" font-size="19" font-weight="700">Make it right</text>
    <text x="402" y="174" fill="#8b949e" font-size="13">Make the system legible.</text>
    <text x="402" y="194" fill="#8b949e" font-size="13">Protect the important paths.</text>

    <path d="M592 164 H629" stroke="#484f58" stroke-width="2"/>
    <path d="M622 158 L632 164 L622 170" fill="none" stroke="#8b949e" stroke-width="2"/>

    <rect x="632" y="112" width="220" height="104" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <circle cx="664" cy="144" r="16" fill="#3fb950"/>
    <text x="664" y="150" fill="#0d1117" font-size="15" font-weight="700" text-anchor="middle">3</text>
    <text x="694" y="146" fill="#f0f6fc" font-size="19" font-weight="700">Make it faster</text>
    <text x="694" y="174" fill="#8b949e" font-size="13">Optimize with evidence.</text>
    <text x="694" y="194" fill="#8b949e" font-size="13">Only where it matters.</text>
  </g>
</svg>