<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-labelledby="title desc">
  <title id="title">A cheerful build bot in motion</title>
  <desc id="desc">A small robot floats through a stream of colored build stages.</desc>
  <rect width="900" height="120" rx="18" fill="#0d1117"/>
  <g opacity=".8">
    <circle cx="82" cy="28" r="3" fill="#58a6ff"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="34" r="4" fill="#3fb950"><animate attributeName="opacity" values="1;.2;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="88" r="3" fill="#f0883e"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(62 23)">
    <animateTransform attributeName="transform" type="translate" values="62 23;62 14;62 23" dur="2.4s" repeatCount="indefinite"/>
    <rect x="0" y="18" width="88" height="60" rx="18" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <rect x="22" y="0" width="44" height="25" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <path d="M44 0 V-10" stroke="#58a6ff" stroke-width="3"/>
    <circle cx="44" cy="-13" r="4" fill="#3fb950"/>
    <circle cx="27" cy="47" r="6" fill="#f0f6fc"/>
    <circle cx="61" cy="47" r="6" fill="#f0f6fc"/>
    <path d="M25 64 Q44 76 63 64" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
    <text x="44" y="52" fill="#0d1117" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">&lt;/&gt;</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="184" y="48" fill="#f0f6fc" font-size="20" font-weight="700">Build. Learn. Iterate.</text>
    <text x="184" y="74" fill="#8b949e" font-size="14">Small experiments → clear systems → compounding improvements</text>
  </g>
  <g transform="translate(665 45)">
    <rect x="0" y="0" width="54" height="28" rx="14" fill="#f0883e"/>
    <text x="27" y="19" fill="#0d1117" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">WORK</text>
    <animateTransform attributeName="transform" type="translate" values="665 45;675 45;665 45" dur="2.4s" repeatCount="indefinite"/>
  </g>
  <path d="M733 59 H754" stroke="#8b949e" stroke-width="2" stroke-linecap="round"/>
  <path d="M748 53 L756 59 L748 65" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(763 45)">
    <rect x="0" y="0" width="58" height="28" rx="14" fill="#58a6ff"/>
    <text x="29" y="19" fill="#0d1117" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">RIGHT</text>
    <animateTransform attributeName="transform" type="translate" values="763 45;773 45;763 45" dur="2.4s" begin=".2s" repeatCount="indefinite"/>
  </g>
  <path d="M829 59 H850" stroke="#8b949e" stroke-width="2" stroke-linecap="round"/>
  <path d="M844 53 L852 59 L844 65" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>